{% extends "base.html" %}
{% block title %}Log in - Maybe Boogie{% endblock %}
{% block content %}
<section class="card auth">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<div class="error" role="alert">That username and password don't match. Check both and try again.</div>{% endif %}
    <div class="field"><label for="{{ form.username.id_for_label }}">Username</label>{{ form.username }}</div>
    <div class="field"><label for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <div class="actions">
      <button class="btn btn-pink" type="submit">Log in</button>
      <a href="/">Back</a>
    </div>
  </form>
{% endblock %}
