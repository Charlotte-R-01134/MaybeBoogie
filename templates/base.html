{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Maybe Boogie{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <header class="nav wrap">
    <a class="logo" href="/">Maybe Boogie</a>
    <nav aria-label="Main">
      {% if user.is_authenticated %}
        <a href="/account/">{{ user.username }}</a>
        <form class="inline" method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn-small" type="submit">Log out</button>
        </form>
      {% else %}
        <a class="btn btn-small" href="{% url 'login' %}">Log in</a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
